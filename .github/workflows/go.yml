name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:

  build:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # Must run after checkout: module caching keys off go.sum.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build
      run: make test

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Helm
      uses: azure/setup-helm@v5

    # Catches a broken or stale chart here rather than when the release runs.
    - name: Verify chart
      run: ./hack/verify-release.sh --pre-release
