name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:

  build:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # Must run after checkout: module caching keys off go.sum.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build
      run: make test

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        # Needed to tell whether this change touches the chart.
        fetch-depth: 0

    - name: Check out chart repo
      # Lets the check see which chart versions are already published.
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: gh-pages

    - name: Set up Helm
      uses: azure/setup-helm@v5

    # Catches a broken or stale chart here rather than when the release runs.
    - name: Verify chart
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # The published version only matters when the chart itself changes.
        # Every other change would otherwise fail on a version it never touched.
        if [ -n "$BASE_SHA" ] && ! git diff --quiet "$BASE_SHA" HEAD -- helm/; then
          ./hack/verify-release.sh --pre-release gh-pages/charts/repo
        else
          ./hack/verify-release.sh --pre-release
        fi
