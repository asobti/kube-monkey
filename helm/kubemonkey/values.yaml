# Default values for kubemonkey.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# The service account the pods will use to interact with the Kubernetes API
serviceAccount:
  # If set, an existing Service Account is used. Else a Service Account is created automatically
  name: ""

image:
  repository: ayushsobti/kube-monkey
  tag: v0.5.4
  pullPolicy: IfNotPresent
imagePullSecrets: {}
config:
  dryRun: true  
  runHour: 8
  startHour: 10
  endHour: 16
  blacklistedNamespaces:
    - kube-system
  whitelistedNamespaces:  []
  timeZone: America/New_York
  debug:
   enabled: false # if you want to enable debugging and see how pods killed immediately set enabled and schedule_immediate_kill to true
   schedule_immediate_kill: false
  notifications:
   enabled: false
   proxy: ""
   attacks: ""
  metrics:
   enabled: false # serves Prometheus metrics on /metrics and creates a Service for them
   port: 8080

# Scrape the metrics endpoint with the Prometheus Operator. Needs config.metrics.enabled
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

args:
  logLevel: 5
  # Directory for the glog log files. Leave it empty to log to the container's
  # stderr only, which is what `kubectl logs` reads. The image has no writable
  # filesystem of its own, so setting a directory also needs a writable volume
  # mounted at that exact path (see additionalVolumes below).
  logDir: ""
  # Extra command line flags for kube-monkey, e.g. ["-stderrthreshold=INFO"]
  extraArgs: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

additionalVolumes: []
# - name: log
#   emptyDir: {}

additionalVolumeMounts: []
# - name: log
#   mountPath: "/var/log/kube-monkey"

# Running as a non-root user needs no extra setup while logs go to stderr. If
# you also set args.logDir, mount a writable volume at that path, otherwise the
# user cannot create the directory and kube-monkey will not start.
podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1001
  # runAsGroup: 1001
  # fsGroup: 1001